<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 在线学习平台</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e; --panel-bg: #252526; --border-color: #333333;
            --text-color: #d4d4d4; --text-muted: #858585;
            --primary-color: #0e639c; --success-color: #4CAF50;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-code: Consolas, 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: var(--font-main); height: 100vh; width: 100vw;
            overflow: hidden; display: grid; grid-template-columns: 65% 35%;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #2d2d2d; padding: 8px 15px; font-size: 14px;
            border-bottom: 1px solid var(--border-color); border-top: 1px solid var(--border-color);
        }

        .left-column { display: flex; flex-direction: column; border-right: 1px solid var(--border-color); height: 100vh; }
        .editor-section { height: 60%; display: flex; flex-direction: column; }
        
        .run-btn {
            background-color: var(--success-color); color: white; border: none;
            padding: 5px 15px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .run-btn:hover { background-color: #45a049; }
        .run-btn:disabled { background-color: #555; cursor: not-allowed; }

        textarea {
            width: 100%; height: 100%; background-color: var(--bg-color);
            color: #9cdcfe; font-family: var(--font-code); font-size: 15px;
            border: none; padding: 10px; resize: none; outline: none; line-height: 1.5;
        }

        .io-section { height: 40%; display: flex; }
        .io-box { flex: 1; display: flex; flex-direction: column; }
        .io-box:first-child { border-right: 1px solid var(--border-color); }
        .io-box textarea { color: var(--text-color); }
        #outputData { background-color: #1a1a1a; }

        .right-column { display: flex; flex-direction: column; height: 100vh; background-color: var(--panel-bg); }
        .tabs { display: flex; background-color: #2d2d2d; border-bottom: 1px solid var(--border-color); }
        .tab-btn {
            flex: 1; background: none; border: none; color: var(--text-muted);
            padding: 12px 0; cursor: pointer; font-size: 14px;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab-btn:hover { color: var(--text-color); }
        .tab-btn.active {
            color: var(--text-color); border-bottom: 2px solid var(--primary-color); background-color: var(--panel-bg);
        }

        .chat-history {
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 14px;
            line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; font-family: var(--font-main);
        }
        .msg-ai { align-self: flex-start; background-color: #383838; color: var(--text-color); border-bottom-left-radius: 2px; }
        .msg-student { align-self: flex-end; background-color: var(--primary-color); color: #ffffff; border-bottom-right-radius: 2px; }

        .chat-input-area {
            height: 150px; border-top: 1px solid var(--border-color);
            display: flex; flex-direction: column; background-color: var(--bg-color); padding: 10px;
        }
        .chat-input-area textarea {
            flex: 1; background-color: transparent; color: var(--text-color);
            font-family: var(--font-main); font-size: 14px; padding: 5px;
        }
        .chat-actions { display: flex; justify-content: flex-end; margin-top: 5px; }
        .send-btn {
            background-color: var(--primary-color); color: white; border: none;
            padding: 6px 16px; border-radius: 3px; cursor: pointer; font-size: 13px;
        }
        .send-btn:hover { background-color: #1177bb; }
        .send-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- 左侧：代码编辑与运行 -->
    <div class="left-column">
        <div class="editor-section">
            <div class="section-header">
                <span>Python 代码</span>
                <button class="run-btn" id="runBtn" title="运行当前代码">运行</button>
            </div>
            <textarea id="codeEditor" spellcheck="false" placeholder="在此编写 Python 代码...">print('hello')</textarea>
        </div>
        
        <div class="io-section">
            <div class="io-box">
                <div class="section-header"><span>输入数据区 (stdin)</span></div>
                <textarea id="inputData" spellcheck="false" placeholder="在此输入程序需要的标准输入，例如多行测试用例..."></textarea>
            </div>
            <div class="io-box">
                <div class="section-header"><span>输出结果区 (stdout)</span></div>
                <textarea id="outputData" readonly placeholder="程序的输出结果将显示在这里..."></textarea>
            </div>
        </div>
    </div>

    <!-- 右侧：AI 辅导助手 -->
    <div class="right-column">
        <div class="tabs">
            <button class="tab-btn active" data-mode="diagnostics">代码诊断</button>
            <button class="tab-btn" data-mode="chat">自由对话</button>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="chat-input-area">
            <textarea id="chatInput" placeholder="输入你想问的问题，按 Ctrl+Enter 发送..."></textarea>
            <div class="chat-actions">
                <button class="send-btn" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================
        // 1. Pyodide 核心运行逻辑 (双轨输入模式)
        // ==========================
        
        // 挂载全局函数，用于向输出区实时追加文本
        window.append_to_output = function(text) {
            const outputArea = document.getElementById('outputData');
            outputArea.value += text;
            outputArea.scrollTop = outputArea.scrollHeight; // 自动滚动到底部
        };

        async function executePythonCode() {
            const code = document.getElementById('codeEditor').value;
            const inputData = document.getElementById('inputData').value;
            const outputArea = document.getElementById('outputData');
            const runBtn = document.getElementById('runBtn');

            outputArea.value = ""; 
            runBtn.disabled = true;

            if (!window.pyodide) {
                runBtn.textContent = "环境加载中...";
                outputArea.value = "首次运行正在初始化 Python 环境，请稍候...\n";
                try {
                    window.pyodide = await loadPyodide({
                        indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/", 
                        stdout: (text) => { window.append_to_output(text + '\n'); },
                        stderr: (text) => { window.append_to_output(text + '\n'); }
                    });
                    outputArea.value = ""; 
                } catch (e) {
                    outputArea.value = "Python 环境加载失败，请检查网络或本地路径：\n" + e;
                    runBtn.disabled = false; runBtn.textContent = "运行"; return;
                }
            }

            runBtn.textContent = "运行中";
            try {
                window.pyodide.globals.set("raw_input_data", inputData);
                
                await window.pyodide.runPythonAsync(`
import sys
import io
import builtins
import js

if raw_input_data:
    # 模式1：OJ 测评模式
    sys.stdin = io.StringIO(raw_input_data)
    if hasattr(builtins, "__original_input__"):
        builtins.input = builtins.__original_input__
else:
    # 模式2：初学者交互模式
    sys.stdin = sys.__stdin__ 
    
    if not hasattr(builtins, "__original_input__"):
        builtins.__original_input__ = builtins.input
        
    def custom_interactive_input(prompt_text=""):
        if prompt_text:
            js.append_to_output(prompt_text)
            
        user_val = js.prompt(prompt_text)
        
        if user_val is None:
            raise EOFError("执行中止：取消了输入")
            
        js.append_to_output(user_val + "\\n")
        return user_val
        
    builtins.input = custom_interactive_input
                `);
                
                await window.pyodide.runPythonAsync(code);
                
            } catch (err) {
                window.append_to_output(err.toString() + "\n");
            } finally {
                runBtn.disabled = false; 
                runBtn.textContent = "运行";
            }
        }

        // 绑定运行事件（全局仅绑定一次）
        document.getElementById('runBtn').addEventListener('click', executePythonCode);

        // 编辑器支持 Tab 缩进（全局仅绑定一次）
        document.getElementById('codeEditor').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // ==========================
        // 2. AI 辅导助手逻辑 (请求本地 Flask API)
        // ==========================
        let currentMode = 'diagnostics';
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatInputEl = document.getElementById('chatInput');
        const sendBtnEl = document.getElementById('sendBtn');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const newMode = e.target.getAttribute('data-mode');
                if (currentMode !== newMode) {
                    currentMode = newMode;
                    chatHistoryEl.innerHTML = ''; 
                    appendMessage("ai", currentMode === 'diagnostics' ? "你好！我是代码诊断助手。在下方输入问题后，我会自动读取你左侧的代码帮你检查错误。" : "你好！我是编程辅导AI，有什么编程、算法或信息技术相关的问题都可以问我。");
                }
            });
        });

        appendMessage("ai", "你好！我是代码诊断助手。在下方输入问题后，我会自动读取你左侧的代码帮你检查错误。");

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'ai' ? 'msg-ai' : 'msg-student'}`;
            msgDiv.textContent = content;
            chatHistoryEl.appendChild(msgDiv);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        async function callAI(prompt, mode) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, mode: mode })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "服务器响应异常");
                }
                return data.reply;
            } catch (error) {
                console.error("API Error:", error);
                return `[请求失败]: ${error.message}`;
            }
        }

        async function handleSend() {
            const text = chatInputEl.value.trim();
            if (!text) return;

            let payloadText = text;
            if (currentMode === 'diagnostics') {
                const currentCode = document.getElementById('codeEditor').value.trim();
                payloadText = `这是我的代码：\n\`\`\`python\n${currentCode}\n\`\`\`\n我的问题是：${text}`;
            }

            appendMessage('student', text);
            chatInputEl.value = '';
            chatInputEl.focus();

            sendBtnEl.disabled = true;
            sendBtnEl.textContent = '思考中...';

            const reply = await callAI(payloadText, currentMode);

            appendMessage('ai', reply);
            sendBtnEl.disabled = false;
            sendBtnEl.textContent = '发送';
        }

        sendBtnEl.addEventListener('click', handleSend);
        chatInputEl.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                handleSend();
            }
        });
    </script>
</body>
</html>
