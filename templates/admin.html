<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>教师控制台 - 管理中心</title>
    <style>
        body {
            background-color: #1e1e1e; color: #d4d4d4; margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header { background-color: #0e639c; padding: 15px 20px; display: flex; justify-content: space-between; }
        .header a { color: white; text-decoration: none; font-size: 14px; }
        .container { display: flex; padding: 20px; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .panel {
            background-color: #252526; padding: 20px; border-radius: 6px; flex: 1; border: 1px solid #333;
        }
        h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        input, select {
            width: 100%; padding: 8px; background-color: #1e1e1e;
            border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;
        }
        button {
            padding: 8px 15px; background-color: #4CAF50; color: white;
            border: none; border-radius: 4px; cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
        th { color: #858585; }
        .del-btn { background-color: transparent; color: #f48771; padding: 0; font-size: 13px; }
        .del-btn:hover { text-decoration: underline; background-color: transparent; }
    </style>
</head>
<body>

<div class="header">
    <strong>教师控制台</strong>
    <a href="/logout">退出登录</a>
</div>

<div class="container">
    <!-- 左侧：录入表单 -->
    <div class="panel" style="flex: 0.5;">
        <h3>1. 添加班级</h3>
        <form method="POST">
            <input type="hidden" name="action" value="add_class">
            <div class="form-group">
                <input type="text" name="class_name" placeholder="例如：七年级3班" required autocomplete="off">
            </div>
            <button type="submit">添加班级</button>
        </form>

        <h3 style="margin-top: 30px;">2. 录入学生</h3>
        <form method="POST">
            <input type="hidden" name="action" value="add_student">
            <div class="form-group">
                <select name="class_id" required>
                    <option value="">-- 选择班级 --</option>
                    {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <input type="text" name="student_name" placeholder="学生真实姓名" required autocomplete="off">
            </div>
            <button type="submit">添加学生</button>
        </form>
    </div>

    <!-- 右侧：学生名单列表 -->
    <div class="panel">
        <h3>已授权学生名单</h3>
        <table>
            <thead>
                <tr>
                    <th>班级</th>
                    <th>姓名</th>
                    <th width="60">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.c_name }}</td>
                    <td>{{ s.s_name }}</td>
                    <td>
                        <form method="POST" style="margin:0;">
                            <input type="hidden" name="action" value="delete_student">
                            <input type="hidden" name="student_id" value="{{ s.id }}">
                            <button class="del-btn" type="submit" onclick="return confirm('确认移除该学生？')">移除</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="3" style="text-align: center; color: #666;">暂无学生数据</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
