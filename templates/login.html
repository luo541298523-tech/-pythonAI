<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - Python 学习平台</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #252526;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid #333;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #858585;
            transition: 0.3s;
        }
        .tab.active {
            color: #d4d4d4;
            border-bottom: 2px solid #0e639c;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; }
        .form-group input {
            width: 100%;
            padding: 8px;
            background-color: #1e1e1e;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1177bb; }
        .error { color: #f48771; font-size: 13px; margin-bottom: 15px; text-align: center; }
        #adminForm { display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('student')">学生登录</div>
        <div class="tab" onclick="switchTab('admin')">管理登录</div>
    </div>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <!-- 学生登录表单 -->
    <form id="studentForm" method="POST" action="/login">
        <input type="hidden" name="type" value="student">
        <div class="form-group">
            <label>真实姓名：</label>
            <input type="text" name="student_name" placeholder="请输入你的姓名" required autocomplete="off">
        </div>
        <button type="submit">进入学习系统</button>
    </form>

    <!-- 管理员登录表单 -->
    <form id="adminForm" method="POST" action="/login">
        <input type="hidden" name="type" value="admin">
        <div class="form-group">
            <label>账号：</label>
            <input type="text" name="username" placeholder="" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input type="password" name="password" placeholder="" required>
        </div>
        <button type="submit">进入后台管理</button>
    </form>
</div>

<script>
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('studentForm').style.display = 'none';
        document.getElementById('adminForm').style.display = 'none';
        
        if(type === 'student') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('studentForm').style.display = 'block';
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('adminForm').style.display = 'block';
        }
    }
</script>
</body>
</html>
